name: Remote browser 24/7 (chained sessions)

on:
  workflow_dispatch:
    inputs:
      hold_minutes:
        description: 'Minutes before saving state (leave time for upload under GitHub job limit)'
        required: false
        type: choice
        default: '300'
        options:
          - '60'
          - '300'

permissions:
  actions: write
  contents: read

jobs:
  session:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    concurrency:
      group: browser-session-main
      cancel-in-progress: false
    env:
      WEB_USER: preview
      WEB_PASSWORD: ${{ secrets.PREVIEW_WEB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate and sanitize secrets
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Secrets stored via the Windows setup may carry stray whitespace/CR.
          # Sanitize the copies used by later steps (runner memory only).
          WEB_PASSWORD="$(printf '%s' "$WEB_PASSWORD" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          echo "WEB_PASSWORD=$WEB_PASSWORD" >> "$GITHUB_ENV"
          if (( ${#WEB_PASSWORD} < 12 )); then
            echo '::error::Set PREVIEW_WEB_PASSWORD in Actions secrets (12+ chars).'
            exit 1
          fi
          token="$(printf '%s' "$TELEGRAM_BOT_TOKEN" | tr -d '[:space:]')"
          chat_id="$(printf '%s' "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')"
          echo "TG_TOKEN=$token" >> "$GITHUB_ENV"
          echo "TG_CHAT=$chat_id" >> "$GITHUB_ENV"

      - name: Restore previous browser state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SESSION_BACKUP_KEY: ${{ secrets.SESSION_BACKUP_KEY }}
        run: bash scripts/restore-session.sh

      - name: Start browser and quick Cloudflare Tunnel
        run: docker compose -f docker-compose.yml -f docker-compose.rustdesk.yml --profile quick up -d --build

      - name: Get tunnel URL
        id: link
        shell: bash
        run: |
          url=''
          for i in $(seq 1 60); do
            url="$(docker compose -f docker-compose.yml -f docker-compose.rustdesk.yml --profile quick logs --no-color tunnel-quick 2>&1 | grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' | tail -1 || true)"
            if [[ -n "$url" ]]; then break; fi
            sleep 2
          done
          if [[ -z "$url" ]]; then
            docker compose -f docker-compose.yml -f docker-compose.rustdesk.yml --profile quick logs --tail=100 tunnel-quick
            exit 1
          fi
          echo "::notice title=Remote browser session::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "session started $(date -u +%FT%TZ)" > session-ok.txt
          {
            echo '## Remote browser session'
            echo
            echo "Open **$url** and log in with username **preview** and your PREVIEW_WEB_PASSWORD secret."
            echo
            echo '> Browser profile and downloads were restored from the previous encrypted snapshot when available. The next run starts after this one saves its state.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Get RustDesk device ID
        id: rustdesk
        shell: bash
        run: |
          rid=''
          for i in $(seq 1 36); do
            rid="$(docker compose -f docker-compose.yml -f docker-compose.rustdesk.yml logs --no-color browser 2>/dev/null | grep -o 'RUSTDESK_ID=[0-9]*' | tail -1 | cut -d= -f2 || true)"
            if [[ -n "$rid" ]]; then break; fi
            sleep 5
          done
          if [[ -z "$rid" ]]; then
            echo '::warning::RustDesk ID not found in logs; KasmVNC link still works.'
          fi
          echo "id=$rid" >> "$GITHUB_OUTPUT"

      - name: Send session link via Telegram (non-blocking)
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.link.outputs.url }}
          HOLD_MINUTES: ${{ inputs.hold_minutes }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUSTDESK_ID: ${{ steps.rustdesk.outputs.id }}
        run: |
          if [[ ! "$TG_TOKEN" =~ ^[0-9]+:[A-Za-z0-9_-]+$ || ! "$TG_CHAT" =~ ^-?[0-9]+$ ]]; then
            echo '::warning::Telegram token or chat ID is invalid; link is in the run Summary.'
            exit 0
          fi
          message="$(printf 'Phiên trình duyệt MỚI đã sẵn sàng!\n\nLink: %s\nTài khoản: preview\nThời lượng phiên: %s phút (phiên kế tự nối trước khi hết giờ)\n\nWorkflow: %s' "$PREVIEW_URL" "$HOLD_MINUTES" "$RUN_URL")"
          if [[ -n "$RUSTDESK_ID" ]]; then
            message="${message}"$'\n\n'"ID RustDesk: ${RUSTDESK_ID} (mở app RustDesk, nhập ID, mật khẩu = mật khẩu web)"
          fi
          if curl --fail --silent --show-error --retry 2 --retry-delay 2 --max-time 30 \
            --request POST \
            --data-urlencode "chat_id=$TG_CHAT" \
            --data-urlencode "text=$message" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" > /dev/null; then
            echo 'Telegram link notification sent.'
          else
            echo '::warning::Telegram send failed; link is in the run Summary.'
          fi

      - name: Hold session
        shell: bash
        env:
          HOLD_MINUTES: ${{ inputs.hold_minutes }}
        run: |
          total=$(( HOLD_MINUTES * 60 ))
          elapsed=0
          while (( elapsed < total )); do
            sleep 60
            elapsed=$(( elapsed + 60 ))
            if (( elapsed % 600 == 0 )); then
              echo "Holding: $(( elapsed / 60 ))/$HOLD_MINUTES min"
            fi
          done
          echo 'Session time complete.'

      - name: Save browser state
        env:
          SESSION_BACKUP_KEY: ${{ secrets.SESSION_BACKUP_KEY }}
        run: bash scripts/save-session.sh

      - name: Upload encrypted browser state
        uses: actions/upload-artifact@v4
        with:
          name: browser-state
          path: browser-state.tar.gz.enc
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Chain next session after state upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run browser-24x7.yml --ref main

      - name: Stop session
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.rustdesk.yml --profile quick down || true
