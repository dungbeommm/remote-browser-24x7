name: Temporary browser preview (manual, NOT 24/7)

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Preview duration, after the tunnel is ready'
        required: true
        type: choice
        default: '10'
        options:
          - '10'
          - '20'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      WEB_USER: preview
      WEB_PASSWORD: ${{ secrets.PREVIEW_WEB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Require private password
        shell: bash
        run: |
          if (( ${#WEB_PASSWORD} < 12 )); then
            echo 'Set PREVIEW_WEB_PASSWORD in repository Actions secrets (12+ chars).' >&2
            exit 1
          fi
      - name: Start browser and quick Cloudflare Tunnel
        run: docker compose --profile quick up -d --build
      - name: Print temporary HTTPS link
        shell: bash
        run: |
          url=''
          for i in $(seq 1 60); do
            url="$(docker compose --profile quick logs --no-color tunnel-quick 2>&1 | grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' | tail -1 || true)"
            if [[ -n "$url" ]]; then break; fi
            sleep 2
          done
          if [[ -z "$url" ]]; then
            docker compose --profile quick logs --tail=100 tunnel-quick
            exit 1
          fi
          echo "::notice title=Temporary browser preview::$url"
          {
            echo '## Browser preview URL'
            echo
            echo "Open **$url** and log in with username **preview** and your PREVIEW_WEB_PASSWORD secret."
            echo
            echo '> This is an ephemeral development preview only; data is NOT saved across runs and the link expires when this workflow stops.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the test preview available briefly
        env:
          MINUTES: ${{ inputs.duration_minutes }}
        run: sleep "$(( MINUTES * 60 ))"
      - name: Stop preview
        if: always()
        run: docker compose --profile quick down || true
