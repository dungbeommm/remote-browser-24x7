name: Build and smoke-test browser

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts, configs and unit tests
        run: |
          bash -n app/*.sh scripts/*.sh
          python3 -m unittest discover -s tests -v
          WEB_PASSWORD=ci-password-for-test-123456 docker compose --profile quick config --quiet
      - name: Build image
        run: docker build --progress=plain -t remote-browser:ci .
      - name: Start container
        run: |
          docker run --rm -d --name remote-browser-ci \
            -p 127.0.0.1:18080:8080 \
            -e WEB_USER=ci \
            -e WEB_PASSWORD='ci-password-for-test-123456' \
            remote-browser:ci
      - name: Verify HTTP authentication and HTML client
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/healthz > /dev/null 2>&1; then break; fi
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)" = '401'
          curl -fsS -u 'ci:ci-password-for-test-123456' http://127.0.0.1:18080/ | grep -Eqi '<html|kasm'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/downloads/)" = '401'
          docker exec remote-browser-ci /app/healthcheck.sh
      - name: Troubleshooting logs
        if: failure()
        run: |
          docker logs remote-browser-ci || true
          docker ps -a || true
          docker inspect remote-browser-ci --format '{{json .State}}' || true
      - name: Stop container
        if: always()
        run: docker rm -f remote-browser-ci || true
